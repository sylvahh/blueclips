<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blue Clips</title>
<meta name="description" content="Blue Clips posts the best moments from streams and creators as vertical Shorts.">
<link rel="icon" href="avatar.png">
<style>
  :root { --blue: oklch(0.42 0.23 265); --blue-deep: oklch(0.30 0.17 265); --yellow: rgb(255 212 0); }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
         background: var(--blue-deep); color: #fff; font: 17px/1.6 system-ui, -apple-system, sans-serif; }
  main { max-width: 34rem; text-align: center; }
  img { width: 120px; height: 120px; border-radius: 50%; }
  h1 { margin: 16px 0 4px; font-size: 2rem; letter-spacing: -0.01em; }
  .handle { color: var(--yellow); font-weight: 600; margin: 0 0 16px; }
  a { color: var(--yellow); }
  footer { margin-top: 32px; font-size: 0.9rem; }
</style>
</head>
<body>
<main>
  <img src="avatar.png" alt="Blue Clips logo">
  <h1>Blue Clips</h1>
  <p class="handle">@blueclipshq</p>
  <p>Blue Clips posts the best moments from streams and creators as vertical Shorts on YouTube, TikTok and Instagram.</p>
  <p>
    <a href="https://www.youtube.com/@blueclipshq">YouTube</a> ·
    <a href="https://www.tiktok.com/@blueclipshq">TikTok</a> ·
    <a href="https://www.instagram.com/blueclipshq/">Instagram</a>
  </p>
  <footer><a href="privacy.html">Privacy policy</a></footer>
</main>
</body>
</html>
